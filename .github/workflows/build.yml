
name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      game_parts:
        description: "Number of RAR parts in the base game archive"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      content:
        description: "Choose which game content to include"
        required: true
        type: choice
        default: "Base game + update + DLC"
        options:
          - "Base game only"
          - "Base game + update (no DLC)"
          - "Base game + DLC (no update)"
          - "Base game + update + DLC"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:

      # ================================================
      # VALIDATE GAME ARCHIVE PART SECRETS FIRST
      # ================================================

      - name: Validate game archive parts
        env:
          GAME_PARTS: ${{ inputs.game_parts }}
          GAME1_URL: ${{ secrets.Game1 }}
          GAME2_URL: ${{ secrets.Game2 }}
          GAME3_URL: ${{ secrets.Game3 }}
          GAME4_URL: ${{ secrets.Game4 }}
        shell: bash
        run: |
          set -euo pipefail

          case "$GAME_PARTS" in
            1|2|3|4) ;;
            *)
              echo "::error::Invalid game part count: $GAME_PARTS. Choose 1, 2, 3, or 4."
              exit 1
              ;;
          esac

          if [[ "$GAME_PARTS" == "1" ]]; then
            if [[ -z "${GAME1_URL:-}" ]]; then
              echo "::error::Single-part game archive requires the Game1 secret."
              exit 1
            fi
            echo "Verified required game archive secret: Game1"
          else
            for part in $(seq 1 "$GAME_PARTS"); do
              variable="GAME${part}_URL"
              if [[ -z "${!variable:-}" ]]; then
                echo "::error::Game archive is set to $GAME_PARTS parts, but required secret $variable is missing or empty."
                echo "::error::Configure Game1 through Game$GAME_PARTS in repository Actions secrets, then rerun."
                exit 1
              fi
              echo "Verified required game archive secret: $variable"
            done
          fi

          echo "All $GAME_PARTS required game archive part secret(s) are present."

      # ================================================
      # PREPARE PYTHON AND RAR EXTRACTION TOOL
      # ================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install RAR extraction tool
        shell: bash
        run: |
          set -euo pipefail
          brew install unar
          command -v unar

      # ================================================
      # DOWNLOAD GAME / UPDATE / DLC
      # DECODE BASE64 KEYS
      # ================================================

      - name: Download game files and decode keys
        env:
          GAME_PARTS: ${{ inputs.game_parts }}
          GAME1_URL: ${{ secrets.Game1 }}
          GAME2_URL: ${{ secrets.Game2 }}
          GAME3_URL: ${{ secrets.Game3 }}
          GAME4_URL: ${{ secrets.Game4 }}
          UPDATE_URL: ${{ secrets.Update }}
          DLC_URL: ${{ secrets.DLC }}
          KEYS_BASE64: ${{ secrets.Keys }}
          CONTENT_SELECTION: ${{ inputs.content }}
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local filename
            local temporary

            filename="$(basename "$output")"
            temporary="$output.part"

            if [[ -z "${url:-}" ]]; then
              echo "::error::Download URL is empty."
              exit 1
            fi

            echo "========================================"
            echo "Downloading $filename"
            echo "Starting direct download..."
            echo "========================================"

            curl \
              --fail \
              --location \
              --show-error \
              --progress-bar \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "$temporary" \
              "$url"

            if [[ ! -s "$temporary" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            mv "$temporary" "$output"

            echo "Download completed:"
            ls -lh "$output"
            file "$output"

          }

          echo "Downloading $GAME_PARTS base-game RAR part(s)."
          if [[ "$GAME_PARTS" == "1" ]]; then
            download_file "$GAME1_URL" "$WORK/game.part1.rar"
          else
            for part in $(seq 1 "$GAME_PARTS"); do
              variable="GAME${part}_URL"
              url="${!variable}"
              download_file "$url" "$WORK/game.part$part.rar"
            done
          fi

          case "${CONTENT_SELECTION:-}" in
            "Base game only")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=false
              ;;
            "Base game + update (no DLC)")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=false
              ;;
            "Base game + DLC (no update)")
              INCLUDE_UPDATE=false
              INCLUDE_DLC=true
              ;;
            "Base game + update + DLC")
              INCLUDE_UPDATE=true
              INCLUDE_DLC=true
              ;;
            *)
              echo "::error::Unknown content selection: ${CONTENT_SELECTION:-unset}"
              exit 1
              ;;
          esac

          if [[ "$INCLUDE_UPDATE" == true ]]; then
            if [[ -z "${UPDATE_URL:-}" ]]; then
              echo "::error::Update was selected, but UPDATE_URL is not configured."
              exit 1
            fi
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "Update excluded by content selection; skipping."
          fi

          if [[ "$INCLUDE_DLC" == true ]]; then
            if [[ -z "${DLC_URL:-}" ]]; then
              echo "::error::DLC was selected, but DLC_URL is not configured."
              exit 1
            fi
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "DLC excluded by content selection; skipping."
          fi

          if [[ -z "${KEYS_BASE64:-}" ]]; then
            echo "::error::Keys secret is empty."
            exit 1
          fi

          echo "Decoding Base64 encryption keys..."

          python - "$WORK/prod.keys" <<'PY'
          import base64
          import os
          import re
          import sys
          from pathlib import Path

          encoded = os.environ["KEYS_BASE64"].strip()
          encoded = re.sub(r"\s+", "", encoded)

          try:
              decoded = base64.b64decode(
                  encoded,
                  validate=True
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid Base64 encryption keys: {exc}"
              )

          if not decoded:
              raise SystemExit("Decoded keys file is empty.")

          output = Path(sys.argv[1])
          output.write_bytes(decoded)
          output.chmod(0o600)

          print(
              f"Successfully decoded keys file: "
              f"{len(decoded):,} bytes"
          )
          PY

          test -s "$WORK/prod.keys"

          echo "All downloads and key preparation completed."

      # ================================================
      # EXTRACT RAR / VALIDATE PACKAGES
      # ================================================

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])

          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }

          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)
                  f.seek(0x100)
                  xci_magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              # XCI has a 0x100-byte signature area; HEAD is at offset 0x100.
              if suffix in (".xci", ".xcz") and xci_magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature at offset 0x100: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )

              validate_package(source)
              shutil.move(str(source), str(target))

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def process_download(label, source_override=None):
              source = (
                  Path(source_override)
                  if source_override
                  else work / f"{label}.download"
              )

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )

              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)

                  print(f"{label}: RAR archive detected; extracting.")

                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )

                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )

                  for package in packages:
                      add_package(package, label)

              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )

                  with source.open("rb") as f:
                      f.seek(0x100)
                      xci_magic = f.read(4)

                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif xci_magic == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.move(str(source), str(target))
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

              # Once the package has been moved into GameFiles, remove its
              # source archive immediately to reclaim disk space.
              if source_override:
                  for archive in work.glob("game.part*.rar"):
                      archive.unlink(missing_ok=True)
              else:
                  source.unlink(missing_ok=True)


          if (work / "game.part1.rar").exists():
              process_download("game", work / "game.part1.rar")
          else:
              raise SystemExit("The first base-game RAR part is missing.")

          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")

          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"


      # ================================================
      # SELECT AND VERIFY THE REQUIRED METALFX SDK
      # ================================================

      - name: Select and verify Xcode 27 MetalFX SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode applications:"
          ls -d /Applications/Xcode*.app

          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "iOS SDK: $SDK_VERSION"
          echo "SDK path: $SDK_PATH"

          if [[ "$SDK_VERSION" != 27.* ]]; then
            echo "::error::Expected iOS 27 SDK, found $SDK_VERSION."
            exit 1
          fi

          METALFX_HEADERS="$SDK_PATH/System/Library/Frameworks/MetalFX.framework/Headers"

          if [[ ! -d "$METALFX_HEADERS" ]]; then
            echo "::error::MetalFX headers not found: $METALFX_HEADERS"
            exit 1
          fi

          for symbol in reactiveMaskTextureUsage colorContentOffsetX; do
            if ! grep -R -q "$symbol" "$METALFX_HEADERS"; then
              echo "::error::Required MetalFX API '$symbol' is missing from the selected SDK."
              exit 1
            fi
            echo "Verified MetalFX API: $symbol"
          done

      # ================================================
      # CHECKOUT LATEST NXNATIVE SOURCES
      # ================================================

      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          fetch-depth: 0

      - name: Checkout latest standard NxNative
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main
          fetch-depth: 0

      # ================================================
      # UPDATE BC FALLBACK WITH LATEST UPSTREAM
      # ================================================

      - name: Update BC fallback with latest upstream NxNative
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        id: source-version
        shell: bash
        run: |
          set -euo pipefail

          echo "BC fallback branch before upstream sync:"
          git log -1 --format='%H %s'

          git remote add upstream https://github.com/seedds/nxnative.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          BC_SHA="$(git rev-parse HEAD)"

          echo "Latest upstream NxNative: $UPSTREAM_SHA"
          echo "BC fallback branch tip: $BC_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
            echo "Upstream merge reported conflicts; checking the explicitly supported conflict paths."

            README_CONFLICT="dm/games/01007EF00011E000/README.md"
            BC_SOURCE_CONFLICT="dm/gfx/nvn/nvn_mtl.m"
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort)"

            while IFS= read -r conflict; do
              [[ -z "$conflict" ]] && continue
              case "$conflict" in
                "$README_CONFLICT"|"$BC_SOURCE_CONFLICT") ;;
                *)
                  echo "::error::Unexpected upstream merge conflict: $conflict"
                  echo "::error::No unreviewed source-code conflict will be discarded."
                  exit 1
                  ;;
              esac
            done <<< "$CONFLICTS"

            if grep -Fxq "$README_CONFLICT" <<< "$CONFLICTS"; then
              echo "Keeping the BC fallback branch's game README so its device-specific notes are preserved."
              git checkout --ours -- "$README_CONFLICT"
              git add "$README_CONFLICT"
            fi

            if grep -Fxq "$BC_SOURCE_CONFLICT" <<< "$CONFLICTS"; then
              echo "Merging upstream's staged/snapshot texture-copy support with the BC fallback conversion paths."
              python - "$BC_SOURCE_CONFLICT" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          path = sys.argv[1]

          def stage(number):
              return subprocess.check_output(
                  ["git", "show", f":{number}:{path}"],
                  text=True,
              )

          ours = stage(2)
          upstream = stage(3)
          working = Path(path).read_text()

          function_start = "static void copy_b2t("
          function_end = "\n// Texture copies a blit cannot do"

          def function(source):
              start = source.find(function_start)
              if start < 0:
                  raise SystemExit("Could not locate copy_b2t() in a merge stage.")
              end = source.find(function_end, start)
              if end < 0:
                  raise SystemExit("Could not locate the end of copy_b2t().")
              return source[start:end]

          ours_fn = function(ours)
          upstream_fn = function(upstream)

          bc_start = ours_fn.find("    uint32_t upf; int ubpp;")
          bc_end = ours_fn.find("    // Into Metal's order (rb_copy_shift)", bc_start)
          if bc_start < 0 or bc_end < 0:
              raise SystemExit("The expected BC fallback conversion block was not found.")

          bc_block = ours_fn[bc_start:bc_end]
          # Upstream now normalizes ordinary and staged snapshot copies into sb.
          # Its arena buffers are CPU-readable shared Metal buffers, so the BC
          # transcoder/decoder can consume the source through sb.contents.
          bc_block = bc_block.replace(
              "[(__bridge id<MTLBuffer>)mb contents]",
              "[sb contents]",
          )
          if "mb" in bc_block:
              raise SystemExit("BC block still refers to the removed mb source variable.")

          insertion = upstream_fn.find("    // Into Metal's order (rb_copy_shift)")
          if insertion < 0:
              raise SystemExit("Upstream copy_b2t() no longer has the expected insertion point.")
          if "uint32_t upf; int ubpp;" in upstream_fn:
              raise SystemExit("Upstream already contains the BC block; refusing duplicate insertion.")

          merged_fn = upstream_fn[:insertion] + bc_block + upstream_fn[insertion:]

          # Upstream removed the BC-fallback ASTC-to-RGBA texture-copy helper,
          # but the merged copy_t2t_enc() still contains its call site. Restore
          # the helper and its Metal kernel from the BC branch before that call.
          astc_marker = "// No BC + Legacy Device Pack:"
          astc_end_marker = "static id<MTLTexture> copy_t2t_enc("
          if "copy_t2t_astc(" not in working[:working.find(astc_end_marker)]:
              astc_start = ours.find(astc_marker)
              astc_end = ours.find(astc_end_marker, astc_start)
              if astc_start < 0 or astc_end < 0:
                  raise SystemExit("Could not locate the BC fallback ASTC texture-copy helper.")
              astc_helper = ours[astc_start:astc_end]
              astc_insert = working.find(astc_end_marker)
              if astc_insert < 0:
                  raise SystemExit("Could not locate copy_t2t_enc() insertion point.")
              working = working[:astc_insert] + astc_helper + working[astc_insert:]
              print("Restored BC fallback copy_t2t_astc() helper and Metal kernel.")

          work_start = working.find(function_start)
          work_end = working.find(function_end, work_start)
          if work_start < 0 or work_end < 0:
              raise SystemExit("Could not locate copy_b2t() in the conflicted working file.")

          merged = working[:work_start] + merged_fn + working[work_end:]
          if any(
              line.startswith(("<<<<<<< ", "=======", ">>>>>>> "))
              for line in merged.splitlines()
          ):
              raise SystemExit("Unresolved conflict markers remain in nvn_mtl.m.")
          if "if (c->flags & DM_COPY_SNAPSHOT)" not in merged_fn:
              raise SystemExit("Upstream snapshot-copy support was not retained.")
          if "if (is_astc4(t.pixelFormat) && nvn_fmt_bc" not in merged_fn:
              raise SystemExit("BC-to-ASTC conversion was not retained.")
          if "if (bc_unpack(c->tex->d.format" not in merged_fn:
              raise SystemExit("BC decompression fallback was not retained.")

          Path(path).write_text(merged)
          print("Resolved copy_b2t(): upstream DM_COPY_SNAPSHOT + BC-to-ASTC + BC decode paths retained.")
          PY
              git add "$BC_SOURCE_CONFLICT"
            fi

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved merge conflicts remain after the supported resolutions."
              git diff --name-only --diff-filter=U
              exit 1
            fi

            GIT_EDITOR=true git merge --continue
            echo "Resolved the supported documentation and BC texture-copy conflicts without dropping either implementation."
          fi

          MERGED_SHA="$(git rev-parse HEAD)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "bc_branch_sha=$BC_SHA" >> "$GITHUB_OUTPUT"
          echo "build_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

          echo "Merged build source:"
          git log -1 --format='%H %s'
          echo "Merge parents:"
          git rev-list --parents -n 1 HEAD

      # ================================================
      # ENVIRONMENT
      # ================================================

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen zstd spirv-cross glslang

          command -v glslangValidator
          glslangValidator --version

          python -m pip install --upgrade pip

          python -m pip install \
            lz4 "capstone>=5,<6" fonttools zbic backports.zstd

      # ================================================
      # RECLAIM RUNNER DISK SPACE
      # ================================================

      - name: Reclaim disk space before shader compilation
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk space before cleanup:"
          df -h "$RUNNER_TEMP"

          echo "Removing simulator devices and runtimes (not the iOS SDK)..."
          xcrun simctl shutdown all || true
          xcrun simctl delete all || true
          xcrun simctl runtime delete all || true

          echo "Removing Xcode build and simulator caches..."
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
          rm -rf "$HOME/Library/Caches/Homebrew"
          brew cleanup -s || true

          echo "Removing duplicate source downloads..."
          WORK="$RUNNER_TEMP/nxnative"
          rm -rf \
            "$WORK/extracted-game" \
            "$WORK/extracted-update" \
            "$WORK/extracted-dlc" \
            "$WORK/game.download" \
            "$WORK/game.part1.rar" \
            "$WORK/game.part2.rar" \
            "$WORK/game.part3.rar" \
            "$WORK/game.part4.rar" \
            "$WORK/update.download" \
            "$WORK/dlc.download"

          echo "Remaining prepared packages:"
          du -sh "$RUNNER_TEMP/GameFiles"/* 2>/dev/null || true

          echo "Disk space after cleanup:"
          df -h "$RUNNER_TEMP"

          AVAILABLE_KB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$AVAILABLE_KB" -lt 15000000 ]]; then
            echo "::error::Less than 15 GB free after cleanup; refusing to start shader compilation."
            exit 1
          fi

      # ================================================
      # DETECT BASE TITLE ID
      # ================================================

      - name: Detect game title ID and select shader profile
        shell: bash
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"
          echo "NxNative will select an existing profile or generate a survey and provisional profile automatically."

          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      # ================================================
      # MATCH THE SHADER TOOL LOCK TO THIS RUNNER
      # ================================================

      - name: Refresh shader tool lock for this runner
        shell: bash
        run: |
          set -euo pipefail

          python dm/gfx/tools/tool_lock.py --update-lock
          python dm/gfx/tools/dmsh_chain.py --header

      # ================================================
      # BUILD UNSIGNED IPA
      # ================================================

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      # ================================================
      # UPLOAD RAW IPA (NO OUTER ZIP)
      # ================================================

      - name: Prepare descriptively named raw IPA artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.device }}" == "iPhone 15 or older (BC fallback)" ]]; then
            cp "$RUNNER_TEMP/NxNative.ipa" "$RUNNER_TEMP/NxNative-IPA-BC-Fallback.ipa"
          else
            cp "$RUNNER_TEMP/NxNative.ipa" "$RUNNER_TEMP/NxNative-IPA-Standard.ipa"
          fi

      - name: Upload raw IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

      # ================================================
      # GENERATE BUILD DIAGNOSTICS
      # ================================================

      - name: Generate build diagnostics
        if: always()
        env:
          DEVICE: ${{ inputs.device }}
          CONTENT_SELECTION: ${{ inputs.content }}
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/NxNative-Diagnostics/build-logs"

          REPORT="$RUNNER_TEMP/NxNative-Diagnostics/diagnostics.txt"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          WORK="$RUNNER_TEMP/nxnative"

          {
            echo "=========================================="
            echo "NXNATIVE BUILD DIAGNOSTICS"
            echo "=========================================="
            echo ""

            echo "BUILD INFORMATION"
            echo "-----------------"
            echo "Status: $BUILD_STATUS"
            echo "Device: $DEVICE"
            echo "Content selection: $CONTENT_SELECTION"
            echo "Profile selection: Automatic (nxnative profile lookup / survey fallback)"
            echo "Detected title ID: ${DETECTED_TITLE_ID:-Not detected}"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $(uname -m)"
            echo "Date: $(date -u)"
            echo ""

            echo "SOURCE INFORMATION"
            echo "------------------"
            echo "Repository: $(git remote get-url origin 2>/dev/null || echo unknown)"
            echo "Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "Branch: $(git branch --show-current 2>/dev/null || echo unknown)"
            echo "NxNative upstream main: $(git rev-parse upstream/main 2>/dev/null || git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "BC fallback branch tip: $(git rev-parse refs/remotes/origin/no-bc 2>/dev/null || echo not-applicable)"
            echo ""

            echo "TOOL VERSIONS"
            echo "-------------"
            python --version 2>&1
            dotnet --version 2>&1 || true
            xcodebuild -version 2>&1 || true

            brew list --versions 2>/dev/null | grep -E \
              'xcodegen|zstd|spirv-cross|unar|glslang' || true

            echo ""

            echo "DOWNLOADED FILES"
            echo "----------------"

            for f in \
              "$WORK/game.download" \
              "$WORK/game.part1.rar" \
              "$WORK/game.part2.rar" \
              "$WORK/game.part3.rar" \
              "$WORK/game.part4.rar" \
              "$WORK/update.download" \
              "$WORK/dlc.download"; do

              if [[ -s "$f" ]]; then
                echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                shasum -a 256 "$f"
              else
                echo "$(basename "$f"): Missing or not configured"
              fi
            done

            if [[ -s "$WORK/prod.keys" ]]; then
              echo "prod.keys: Present (contents excluded)"
              echo "Key file size: $(stat -f%z "$WORK/prod.keys") bytes"
            else
              echo "prod.keys: Missing"
            fi

            echo ""
            echo "PREPARED PACKAGES"
            echo "-----------------"

            if [[ -d "$GAME_DIR" ]]; then
              find "$GAME_DIR" -maxdepth 1 -type f \
                -exec sh -c '
                  for f do
                    echo "$(basename "$f"): $(stat -f%z "$f") bytes"
                    shasum -a 256 "$f"
                  done
                ' sh {} +
            else
              echo "GameFiles directory was not created."
            fi

            echo ""
            echo "IPA OUTPUT"
            echo "----------"

            if [[ -s "$RUNNER_TEMP/NxNative.ipa" ]]; then
              ls -lh "$RUNNER_TEMP/NxNative.ipa"
              shasum -a 256 "$RUNNER_TEMP/NxNative.ipa"
            else
              echo "IPA was not created."
            fi

            echo ""
            echo "DISK SPACE"
            echo "----------"
            df -h "$RUNNER_TEMP" 2>&1 || true

            echo ""
            echo "DIAGNOSTICS COMPLETE"
            echo "=========================================="

          } > "$REPORT" 2>&1

          if [[ -d "$GAME_DIR" ]]; then

            find "$GAME_DIR" -type d \
              \( -name logs -o -name '*_survey' -o -name profile \) \
              -print0 |
            while IFS= read -r -d '' dir; do

              destination="$RUNNER_TEMP/NxNative-Diagnostics/build-logs/$(basename "$(dirname "$dir")")-$(basename "$dir")"

              mkdir -p "$destination"

              cp -R "$dir/." "$destination/" 2>/dev/null || true

            done
          fi

          echo "Diagnostics report generated."
          cat "$REPORT"

      # ================================================
      # ALWAYS UPLOAD DIAGNOSTICS
      # ================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Diagnostics
          path: ${{ runner.temp }}/NxNative-Diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ================================================
      # CLEANUP
      # ================================================

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
